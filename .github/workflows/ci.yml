name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore NameSorter.slnx

      - name: Build
        run: dotnet build NameSorter.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution NameSorter.slnx --configuration Release --no-build
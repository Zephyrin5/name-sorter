name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore NameSorter.slnx

      - name: Build
        run: dotnet build NameSorter.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution NameSorter.slnx --configuration Release --no-build
        
  publish:
    needs: test
    strategy:
      matrix:
        rid: [ win-x64, linux-x64, osx-arm64 ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet publish src/Cli -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: name-sorter-${{ matrix.rid }}
          path: publish
          
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
      - name: Zip and create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          for d in */; do (cd "$d" && zip -r "../${d%/}.zip" .); done
          gh release create "${{ github.ref_name }}" ./*.zip \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" --generate-notes
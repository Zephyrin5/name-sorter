name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore NameSorter.slnx

      - name: Build
        run: dotnet build NameSorter.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution NameSorter.slnx --configuration Release --no-build

  publish:
    needs: test
    timeout-minutes: 15
    strategy:
      matrix:
        rid: [ win-x64, linux-x64, osx-arm64 ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet publish src/Cli -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v7
        with:
          name: name-sorter-${{ matrix.rid }}
          path: publish
          if-no-files-found: error

  release:
    needs: publish
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Zip and create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          for d in */; do (cd "$d" && zip -r "../${d%/}.zip" .); done
          gh release create "$GITHUB_REF_NAME" ./*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes
